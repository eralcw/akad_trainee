name: Atualizar base SES/SUSEP

on:
  schedule:
    - cron: "0 9 5 */3 *"   # dia 5 de jan/abr/jul/out, 09:00 UTC (trimestral)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automacao/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r automacao/requirements.txt
          playwright install --with-deps chromium

      - name: Testes offline
        working-directory: automacao
        run: python -m pytest tests -q

      # A coleta pode falhar (SES fora do ar ou bloqueando o IP do runner).
      # Nesse caso seguimos com o raw/ ja versionado e o job termina em vermelho.
      - name: Coletar no SES
        id: coleta
        working-directory: automacao
        continue-on-error: true
        run: python pipeline.py coletar --headless

      - name: Processar (offline) + contrato + snapshot
        id: processar
        working-directory: automacao
        run: python pipeline.py processar

      - name: Commit do raw e do snapshot
        run: |
          git config user.name "ses-bot"
          git config user.email "ses-bot@users.noreply.github.com"
          git add data/raw data/snapshots data/runs
          git diff --cached --quiet || git commit -m "dados: atualizacao SES $(date -u +%F)"
          git push

      - name: Falhar o job se a coleta falhou (alerta por e-mail)
        if: steps.coleta.outcome == 'failure'
        run: |
          echo "Coleta no SES falhou; dashboard segue no ultimo snapshot valido."
          exit 1

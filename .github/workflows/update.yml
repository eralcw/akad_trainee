name: Atualizar base SES/SUSEP

on:
  schedule:
    - cron: "0 9 5 */3 *"   # dia 5 de jan/abr/jul/out, 09:00 UTC (trimestral)
  workflow_dispatch:
    inputs:
      ramos:
        description: "Códigos de ramo separados por vírgula (vazio = todos)"
        required: false
        default: ""
      anos:
        description: "Anos separados por vírgula (vazio = config; só para ano fechado)"
        required: false
        default: ""
      periodo_ini:
        description: "AAAAMM inicial para recorte parcial (vazio = ano fechado)"
        required: false
        default: ""
      periodo_fim:
        description: "AAAAMM final para recorte parcial"
        required: false
        default: ""
      coletar:
        description: "Baixar do SES?"
        type: choice
        options: ["sim", "nao"]
        default: "sim"
      forcar:
        description: "Re-extrair mesmo o que já existe?"
        type: choice
        options: ["nao", "sim"]
        default: "nao"

permissions:
  contents: write

concurrency:
  group: ses-update
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automacao/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r automacao/requirements.txt
          playwright install --with-deps chromium

      - name: Testes offline
        working-directory: automacao
        run: python -m pytest tests -q

      - name: Atualizar base
        id: atualizar
        working-directory: automacao
        continue-on-error: true
        shell: bash
        env:
          RAMOS: ${{ inputs.ramos }}
          ANOS: ${{ inputs.anos }}
          PERIODO_INI: ${{ inputs.periodo_ini }}
          PERIODO_FIM: ${{ inputs.periodo_fim }}
          COLETAR: ${{ inputs.coletar }}
          FORCAR: ${{ inputs.forcar }}
        run: |
          set -euo pipefail
          run() {
            python "$@" 2>&1 | tee -a /tmp/atualizar.log
            return "${PIPESTATUS[0]}"
          }
          args=()
          if [ -n "$RAMOS" ]; then
            IFS=',' read -r -a arr <<< "$RAMOS"
            args+=(--ramos "${arr[@]}")
          fi

          if [ -n "$PERIODO_INI" ]; then
            if [ -z "$PERIODO_FIM" ]; then
              echo "periodo_ini informado sem periodo_fim"; exit 2
            fi
            if [ "$FORCAR" = "sim" ]; then
              args+=(--forcar)
            fi
            if [ "$COLETAR" = "nao" ]; then
              run pipeline.py periodo --periodo-ini "$PERIODO_INI" --periodo-fim "$PERIODO_FIM" --offline "${args[@]}"
            else
              run pipeline.py periodo --periodo-ini "$PERIODO_INI" --periodo-fim "$PERIODO_FIM" --headless "${args[@]}"
            fi
          else
            if [ "$COLETAR" = "nao" ]; then
              run pipeline.py processar
            else
              if [ -n "$ANOS" ]; then
                IFS=',' read -r -a arr <<< "$ANOS"
                args+=(--anos "${arr[@]}")
              fi
              if [ "$FORCAR" = "sim" ]; then
                args+=(--forcar)
              fi
              run pipeline.py atualizar --headless "${args[@]}"
            fi
          fi

      - name: Resumo da atualizacao
        if: always()
        run: |
          {
            echo "### Atualizacao SES"
            if [ -f /tmp/atualizar.log ]; then
              echo '```'
              tail -n 25 /tmp/atualizar.log
              echo '```'
            else
              echo "Sem log: a etapa de atualizacao nao chegou a rodar."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit do raw e dos snapshots
        run: |
          mkdir -p data/atualizacoes
          git config user.name "ses-bot"
          git config user.email "ses-bot@users.noreply.github.com"
          git add data/raw data/atualizacoes data/snapshots data/runs
          git diff --cached --quiet || git commit -m "dados: atualizacao SES $(date -u +%F)"
          git push

      - name: Falhar o job se a atualizacao falhou (alerta por e-mail)
        if: steps.atualizar.outcome == 'failure'
        run: |
          echo "A atualizacao falhou. O dashboard segue no ultimo snapshot/atualizacao valida."
          exit 1
